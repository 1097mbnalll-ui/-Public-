name: Android APK

on:
  push:
    branches: [claude/travel-guide-design]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rahhal.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: رحّال للأندرويد
          body: "حمّل rahhal.apk وثبّته على جوال الأندرويد. Download rahhal.apk and install it on your Android phone."
          files: rahhal.apk
          make_latest: true
